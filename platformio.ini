; Live AQI Monitor — ESP32-S3 + Sharp GP2Y1010AU0F -> ThingsBoard
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Uncomment if your board only has the native USB port (no USB-UART chip)
    ; and you want Serial output over it:
    ; -DARDUINO_USB_CDC_ON_BOOT=1
