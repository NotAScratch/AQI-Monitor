; Live AQI Monitor — ESP32 + Sharp GP2Y1010AU0F -> ThingsBoard + P10 LED panel
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Sources live in AQI_Monitor/ so the same folder also opens in the Arduino IDE.

[platformio]
src_dir = AQI_Monitor
include_dir = AQI_Monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/ahmadfathan/DMD32Plus.git#1.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
